<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>书连书｜发现一本书里的另一些书</title>
  <meta name="description" content="输入中文书名或上传自己的电子书，发现书中明确提到的其他作品。">
  <meta property="og:title" content="书连书｜发现一本书里的另一些书">
  <meta property="og:description" content="从一本书，走进一座图书馆。">
  <meta property="og:image" content="./og.png">

  <link rel="stylesheet" href="./styles.css">

<body>
<main>
  <header class="topbar">
    <a class="brand" href="./" aria-label="书连书首页"><span class="brand-mark">书</span><span>书连书</span></a>
    <span class="edition">DeepSeek 实时图书关联检索</span>
  </header>
  <section class="hero">
    <div class="hero-copy">
      <p class="eyebrow">从一本书，走进一座图书馆</p>
      <h1>你读的书里，<br><em>还藏着哪些书？</em></h1>
      <p class="lead">输入中文书名，实时发现书中提到、引用或致敬的作品；也可以上传自己的电子书，基于原文获得更可靠的结果。</p>
    </div>
    <div class="search-panel">
      <form id="search-form" class="search-form">
        <label for="book-search">输入一本中文书名</label>
        <div class="input-row">
          <input id="book-search" placeholder="例如：如何阅读一本书" autocomplete="off">
          <button type="submit">查找书中之书 <span aria-hidden="true">→</span></button>
        </div>
      </form>
      <div class="examples"><span>试试：</span><button data-example></button><button data-example></button><button data-example></button></div>
    </div>
    <div class="book-stack" aria-hidden="true"><span class="book b1"></span><span class="book b2"></span><span class="book b3"></span><span class="book b4"></span><span class="book b5"></span></div>
  </section>
  <section id="results" class="results" aria-live="polite" hidden></section>
  <section id="how" class="how">
    <p class="kicker">如何使用</p>
    <div class="steps">
      <div><b>01</b><h3>选择查询方式</h3><p>输入中文书名获取公开知识线索，或上传合法来源的电子书进行原文分析</p></div>
      <div><b>02</b><h3>查看书中提及</h3><p>查看书名、作者、提及语境和可信度；原文分析还会提供证据与章节位置</p></div>
      <div><b>03</b><h3>核对并继续阅读</h3><p>结合原书复核 AI 结果，点击书名即可前往豆瓣查找对应版本</p></div>
    </div>
  </section>
  <footer><span>书连书 · 让每一次阅读都有下一站</span><span>文件不保存 · AI 结果请结合原书复核</span></footer>
</main>
